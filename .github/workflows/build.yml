name: Build Desktop App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Install helper build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-douyin-helper.txt pyinstaller==6.22.0

      - name: Frontend and sidecar manifest tests
        run: npm test

      - name: Python helper tests
        run: npm run test:helper

      - name: Frontend typecheck
        run: npm run check

      - name: Build frontend bundle
        run: npm run build

      - name: Build Python helper sidecar
        run: npm run build:helper

      - name: Prepare and verify fixed sidecars
        run: npm run prepare:sidecars

      - name: Rust formatting
        run: cargo fmt --all -- --check
        working-directory: src-tauri

      - name: Rust lint and tests
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Rust tests
        run: cargo test --all-targets
        working-directory: src-tauri

      - name: Build Windows desktop bundle
        if: runner.os == 'Windows'
        run: npm run tauri:build -- --bundles ${{ matrix.bundles }} --config src-tauri/tauri.windows.conf.json

      - name: Build macOS desktop bundle
        if: runner.os == 'macOS'
        run: npm run tauri:build -- --bundles ${{ matrix.bundles }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: streamverse-${{ matrix.os }}-${{ matrix.bundles }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
